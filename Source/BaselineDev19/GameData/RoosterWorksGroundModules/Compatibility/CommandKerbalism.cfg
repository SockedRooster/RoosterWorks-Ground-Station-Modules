// Additive ground-only counterparts; existing station patches untouched.
@PART[RW_GND_CMD]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 12
        %maxAmount = 12
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 6
        %maxAmount = 6
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 1800
        %maxAmount = 1800
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 1100
        %maxAmount = 1100
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 12
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 8
    }
}

@PART[RW_GND_CMD]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 5.8
        %surface = 21.5
    }
}
