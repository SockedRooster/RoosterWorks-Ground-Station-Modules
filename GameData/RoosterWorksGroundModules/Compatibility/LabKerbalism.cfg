// Additive ground-only counterparts; existing station patches untouched.
@PART[RW_GND_LAB]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 18
        %maxAmount = 18
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 9
        %maxAmount = 9
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 2500
        %maxAmount = 2500
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 1500
        %maxAmount = 1500
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 20
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 12
    }
}

@PART[RW_GND_LAB]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 14.3
        %surface = 36.5
    }
}

@PART[RW_GND_LAB]:NEEDS[Kerbalism,FeatureScience]:AFTER[zzzKerbalismDefault]
{
    !MODULE[ModuleScienceLab],*
    {
    }
    !MODULE[ModuleScienceConverter],*
    {
    }
    %MODULE[Laboratory]
    {
        %name = Laboratory
        %ec_rate = 3.5
        %analysis_rate = 0.0006
        %researcher = Scientist@0
        %cleaner = true
    }
}

@PART[RW_GND_LAB]:NEEDS[Kerbalism,FeatureScience]:AFTER[zzzKerbalismDefault]
{
    !MODULE[ModuleScienceExperiment],*
    {
    }
    !MODULE[ModuleScienceContainer],*
    {
    }
    !MODULE[Experiment]:HAS[#experiment_id[temperatureScan]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = temperatureScan
        data_rate = .0033
        ec_rate = .002
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[barometerScan]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = barometerScan
        data_rate = .0035
        ec_rate = .003
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[gravityScan]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = gravityScan
        data_rate = .0012
        ec_rate = .009
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[atmosphereAnalysis]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = atmosphereAnalysis
        data_rate = .0028
        ec_rate = .014
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[mobileMaterialsLab]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = mobileMaterialsLab
        data_rate = .0005
        ec_rate = .040
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[mysteryGoo]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = mysteryGoo
        data_rate = .0005
        ec_rate = .025
        allow_shrouded = False
    }
    !MODULE[Experiment]:HAS[#experiment_id[geigerCounter]],*
    {
    }
    MODULE
    {
        name = Experiment
        experiment_id = geigerCounter
        data_rate = .0010
        ec_rate = .005
        allow_shrouded = False
    }
    !MODULE[HardDrive],*
    {
    }
    MODULE
    {
        name = HardDrive
        title = RW-LAB-250 Research Archive
        dataCapacity = 96
        sampleCapacity = 20
    }
}
