// Dedicated balance after generic SystemHeat/Kerbalism conversion passes.
// All ten rigs use 7.5 EC/s: output resource unit size does not multiply heat.
@PART[RW_GND_DRILL,RW_GND_DRILL_*]:NEEDS[SystemHeat]:FINAL
{
    !MODULE[ModuleCoreHeat],* {}
    !MODULE[ModuleOverheatDisplay],* {}
    !MODULE[ModuleSystemHeat],* {}
    MODULE
    {
        name = ModuleSystemHeat
        moduleID = RW_DrillHeat
        iconName = Icon_Drill
        volume = 0.25
    }
    @MODULE[*]:HAS[#HarvesterType[0],#ResourceName[*]],*
    {
        @name = ModuleSystemHeatHarvester
        %moduleID = RW_Drill
        %systemHeatModuleID = RW_DrillHeat
        %systemPower = 7.5
        %systemOutletTemperature = 350
        %shutdownTemperature = 650
        %GeneratesHeat = false
        !TemperatureModifier {}
        !ThermalEfficiency {}
        !systemEfficiency {}
        systemEfficiency
        {
            key = 0 1
            key = 400 1
            key = 650 0
        }
    }
    @MODULE[Reliability]:HAS[#type[ModuleResourceHarvester]],*
    {
        @type = ModuleSystemHeatHarvester
    }
    @MODULE[Reliability]:HAS[#type[Harvester]],*
    {
        @type = ModuleSystemHeatHarvester
    }
}

// Preserve Kerbalism background extraction when the installed bridge exists.
@PART[RW_GND_DRILL,RW_GND_DRILL_*]:NEEDS[SystemHeat,zKerbalismSystemHeat,Kerbalism]:FINAL
{
    @MODULE[ModuleSystemHeatHarvester],*
    {
        @name = SystemHeatHarvesterKerbalism
    }
    @MODULE[Reliability]:HAS[#type[ModuleResourceHarvester]],*
    {
        @type = SystemHeatHarvesterKerbalism
    }
    @MODULE[Reliability]:HAS[#type[Harvester]],*
    {
        @type = SystemHeatHarvesterKerbalism
    }
    @MODULE[Reliability]:HAS[#type[ModuleSystemHeatHarvester]],*
    {
        @type = SystemHeatHarvesterKerbalism
    }
}
