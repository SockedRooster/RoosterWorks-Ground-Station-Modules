// Additive ground-only counterparts; existing station patches untouched.
@PART[RW_GND_HAB]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 36
        %maxAmount = 36
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 18
        %maxAmount = 18
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 5000
        %maxAmount = 5000
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 2000
        %maxAmount = 2000
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 40
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 25
    }
}

@PART[RW_GND_HAB]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 13.5
        %surface = 36.5
    }
}
