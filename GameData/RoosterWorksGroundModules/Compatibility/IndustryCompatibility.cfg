// Ground industry only; preserves stock Ore recipes with and without Kerbalism.
@PART[RW_GND_ISRU,RW_GND_DRILL,RW_GND_MOUNT]:NEEDS[Kerbalism]:FINAL
{
    !MODULE[Habitat],*
    {
    }
    !RESOURCE[Shielding],*
    {
    }
    !RESOURCE[Atmosphere],*
    {
    }
    !RESOURCE[WasteAtmosphere],*
    {
    }
    !RESOURCE[MoistAtmosphere],*
    {
    }
    !MODULE[Sensor]:HAS[#type[habitat_radiation]],*
    {
    }
}

@PART[RW_GND_ISRU,RW_GND_DRILL,RW_GND_MOUNT]:NEEDS[VABOrganizer]:FINAL
{
    %VABORGANIZER
    {
        %organizerSubcategory = crewUtility
    }
}
