// Additive ground-only counterparts; existing station patches untouched.
@PART[RW_GND_HUB]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 6
        %maxAmount = 6
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 3
        %maxAmount = 3
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 900
        %maxAmount = 900
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 500
        %maxAmount = 500
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 6
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 4
    }
}

@PART[RW_GND_HUB]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 16.2
        %surface = 52
    }
}
