// Additive ground-only counterparts; existing station patches untouched.
@PART[RW_GND_CMD]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 2500
        %effectiveDataCapacity = 2500
        %maxDataCapacityFactor = 1
    }
}

@PART[RW_GND_LAB]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 2500
        %effectiveDataCapacity = 2500
        %maxDataCapacityFactor = 1
        %sampleCapacity = 100
        %effectiveSampleCapacity = 100
        %maxSampleCapacityFactor = 1
    }
}

@PART[RW_GND_PWR]:NEEDS[!Kerbalism]:FINAL
{
    %description = Passive power and service core with 2980 EC storage. Current battery balance; white/grey exterior. Generation supplied separately.
}
